name: Build native installers

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: maven
      - name: Build application JAR
        run: mvn -B package -DskipTests
      - uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: "23"
      - name: Build macOS ARM64 DMG
        shell: bash
        run: |
          mkdir -p target/jpackage-input dist/macos-arm64
          cp target/calculator-executable.jar target/jpackage-input/Calculator.jar
          jpackage \
            --type dmg \
            --name Calculator \
            --app-version 1.0.0 \
            --vendor Calculator \
            --description "Geological key-layer, collapse, energy and 3D visualization calculator" \
            --input target/jpackage-input \
            --main-jar Calculator.jar \
            --main-class ui.Launcher \
            --dest dist/macos-arm64 \
            --mac-package-identifier com.example.calculator \
            --mac-package-name Calculator \
            --mac-app-category public.app-category.utilities \
            --java-options -Dfile.encoding=UTF-8
      - uses: actions/upload-artifact@v4
        with:
          name: Calculator-macOS-ARM64
          path: dist/macos-arm64/*.dmg

  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: maven
      - name: Build application JAR
        run: mvn -B package -DskipTests
      - uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: "23"
      - name: Build Windows x64 installer
        shell: pwsh
        run: |
          New-Item target\jpackage-input -ItemType Directory -Force | Out-Null
          New-Item dist\windows-x64 -ItemType Directory -Force | Out-Null
          Copy-Item target\calculator-executable.jar target\jpackage-input\Calculator.jar
          jpackage `
            --type exe `
            --name Calculator `
            --app-version 1.0.0 `
            --vendor Calculator `
            --description "Geological key-layer, collapse, energy and 3D visualization calculator" `
            --input target\jpackage-input `
            --main-jar Calculator.jar `
            --main-class ui.Launcher `
            --dest dist\windows-x64 `
            --win-dir-chooser `
            --win-menu `
            --win-menu-group Calculator `
            --win-shortcut `
            --java-options "-Dfile.encoding=UTF-8"
      - uses: actions/upload-artifact@v4
        with:
          name: Calculator-Windows-x64
          path: dist/windows-x64/*.exe
